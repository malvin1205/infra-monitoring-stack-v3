name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r alarm/requirements.txt
          pip install pytest

      - name: Run test suite
        env:
          DISABLE_ALERT_POLLER: "1"
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (dependency CVEs)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r alarm/requirements.txt --strict
