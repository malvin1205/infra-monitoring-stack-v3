version: "3.8"

services:
  alarm:
    build: ./alarm
    container_name: alarm
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PROMETHEUS_URL=http://192.168.9.16:9090
    volumes:
      - ./alarm:/app
      - ./alarm/targets:/app/targets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3


