version: "3.8"

services:
  alarm:
    build: ./alarm
    container_name: alarm
    restart: unless-stopped
    ports:
      # LAN-wide on purpose — the TV wallboard reaches this over the NOC LAN
      # (see README). State-changing /api/* routes and /webhook require
      # INFRAWATCH_API_KEY / WEBHOOK_SECRET (alarm/auth.py), so LAN visitors
      # can view the dashboard but can't mutate config or forge alerts.
      - "5000:5000"
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-true}
      - INFRAWATCH_API_KEY=${INFRAWATCH_API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    volumes:
      - ./alarm:/app
      - ./alarm/targets:/app/targets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
    # Hardening: no Linux capabilities beyond the default-dropped set are
    # needed (the app binds an unprivileged port and does no raw sockets/
    # network admin), and no-new-privileges blocks setuid/setgid escalation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # read_only pins the image's own filesystem layer read-only; it does NOT
    # affect the two bind mounts above (./alarm:/app, ./alarm/targets), which
    # is exactly what's needed here — the app's actual writes (status.json,
    # infrawatch.db + WAL, .api_key/.webhook_secret, targets/websites.yml,
    # …) all land inside /app, already writable via that bind mount. /tmp is
    # given a small tmpfs since gunicorn/Python may still want a writable
    # scratch dir there even though the app itself never uses it directly.
    read_only: true
    tmpfs:
      - /tmp



