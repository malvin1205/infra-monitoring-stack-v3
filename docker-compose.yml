version: "3.8"

services:
  alarm:
    build: ./alarm
    container_name: alarm
    restart: unless-stopped
    ports:
      # LAN-wide on purpose — the TV wallboard reaches this over the NOC LAN
      # (see README). State-changing /api/* routes and /webhook require
      # INFRAWATCH_API_KEY / WEBHOOK_SECRET (alarm/auth.py), so LAN visitors
      # can view the dashboard but can't mutate config or forge alerts.
      - "5000:5000"
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-true}
      - INFRAWATCH_API_KEY=${INFRAWATCH_API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    volumes:
      - ./alarm:/app
      - ./alarm/targets:/app/targets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M



